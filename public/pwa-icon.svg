<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Brand Red with Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d46" />
      <stop offset="45%" stop-color="#e5322d" />
      <stop offset="100%" stop-color="#ba1a16" />
    </linearGradient>

    <!-- Top Specular Sheen -->
    <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Photo Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Mountain Foreground Gradients -->
    <linearGradient id="mountBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="mountFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5322d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Drop Shadows for Elevation -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#550a08" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle with 116px radius for smooth maskable icon) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#sheen)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.28" />

  <!-- Central Elevated Photo Card Frame (Safe Zone: centered, size 264x264) -->
  <g filter="url(#cardShadow)">
    <rect x="124" y="124" width="264" height="264" rx="36" fill="url(#cardGrad)" />
  </g>

  <!-- Photo Content Area (with clip path) -->
  <g>
    <clipPath id="innerPhotoClip">
      <rect x="140" y="140" width="232" height="232" rx="24" />
    </clipPath>

    <g clip-path="url(#innerPhotoClip)">
      <!-- Soft Sky Background -->
      <rect x="140" y="140" width="232" height="232" fill="#eff6ff" />

      <!-- Golden Sun / Lens -->
      <circle cx="316" cy="198" r="28" fill="url(#sunGrad)" />
      <circle cx="316" cy="198" r="36" fill="#fde047" opacity="0.25" />

      <!-- Distant Mountain -->
      <path d="M 218 372 L 292 274 L 372 372 Z" fill="url(#mountBack)" />

      <!-- Foreground Mountain -->
      <path d="M 132 372 L 216 238 L 306 372 Z" fill="url(#mountFront)" />

      <!-- Water / Ground Baseline Reflection -->
      <rect x="140" y="356" width="232" height="16" fill="#7f1d1d" opacity="0.12" />
    </g>
  </g>

  <!-- Precision Corner "Fit" Brackets (Representing ImageFit Crop & Dimensions) -->
  <g filter="url(#bracketGlow)" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Bracket -->
    <path d="M 104 152 L 104 104 L 152 104" fill="none" />
    <!-- Top-Right Bracket -->
    <path d="M 360 104 L 408 104 L 408 152" fill="none" />
    <!-- Bottom-Left Bracket -->
    <path d="M 104 360 L 104 408 L 152 408" fill="none" />
    <!-- Bottom-Right Bracket -->
    <path d="M 360 408 L 408 408 L 408 360" fill="none" />
  </g>

  <!-- Small Precision Guide Dots on Center Axis -->
  <circle cx="256" cy="92" r="3.5" fill="#ffffff" opacity="0.75" />
  <circle cx="256" cy="420" r="3.5" fill="#ffffff" opacity="0.75" />
  <circle cx="92" cy="256" r="3.5" fill="#ffffff" opacity="0.75" />
  <circle cx="420" cy="256" r="3.5" fill="#ffffff" opacity="0.75" />
</svg>
