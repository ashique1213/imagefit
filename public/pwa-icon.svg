<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- App Logo Graphic: Camera / Document Frame -->
  <rect x="116" y="116" width="280" height="280" rx="48" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="8" />

  <!-- Inner crop marks / focus brackets -->
  <path d="M 156 196 L 156 156 L 196 156" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 356 196 L 356 156 L 316 156" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 156 316 L 156 356 L 196 356" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 356 316 L 356 356 L 316 356" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center image mountain & sun -->
  <circle cx="316" cy="206" r="22" fill="#38bdf8" />
  <path d="M 176 326 L 236 246 L 276 296 L 316 236 L 356 326 Z" fill="url(#primaryGrad)" />

  <!-- Checkmark / privacy shield accent badge -->
  <g transform="translate(320, 320)">
    <circle cx="40" cy="40" r="44" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" />
    <path d="M 26 42 L 36 52 L 56 30" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
